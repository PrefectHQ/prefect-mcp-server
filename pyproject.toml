[project]
name = "prefect-mcp"
description = "MCP server for interacting with Prefect"
readme = "README.md"
dynamic = ["version"]
authors = [{ name = "Prefect Technologies", email = "help@prefect.io" }]
requires-python = ">=3.10"
dependencies = ["fastmcp==4.0.0b2", "prefect>=3.4.22"]


[project.scripts]
prefect-mcp-server = "prefect_mcp_server.__main__:main"
prefect-mcp-cloud-token = "prefect_mcp_server.cloud_token:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.optional-dependencies]
logfire = ["logfire"]

[dependency-groups]
dev = [
    "docs-mcp-server",
    "ipython",
    "pre-commit>=4.3.0",
    "pydantic-ai>=1.0.10",
    "pytest-asyncio>=0.21.0",
    "pytest-env>=1.2.0",
    "pytest-recording>=0.13.4",
    "pytest-rerunfailures>=16.0.1",
    "pytest-sugar>=0.9.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.9",
    "syrupy>=5.0.0",
    "ty>=0.0.1a19",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/prefect_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]


[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", ".git", "dist"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# invalid-argument-type = "ignore"
# no-matching-overload = "ignore"
# unknown-argument = "ignore"
# unresolved-attribute = "ignore"

# call-non-callable = "ignore"
# missing-argument = "ignore"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]

[tool.uv]
# fastmcp 4.0.0b1 dropped the exact `mcp==2.0.0b2` pin its alphas carried, and mcp /
# mcp-types are stable at 2.0.0, so only the prerelease opt-in for fastmcp-slim remains.
constraint-dependencies = ["fastmcp-slim==4.0.0b2"]
# Released pydantic-ai still caps `fastmcp-slim[client]<4`, so this override is what
# lets the pinned revision below resolve against FastMCP 4. Drop it, and the git
# sources, once a pydantic-ai release carries the widened range.
# The extras must match what `fastmcp` itself asks for — an override replaces every
# requirement on the package, so narrowing to [client] here strips server support.
override-dependencies = ["fastmcp-slim[client,server]>=4.0.0b2"]

[tool.uv.workspace]
members = [
    "packages/docs_mcp_server",
    "packages/ingestion_pipeline",
]

[tool.uv.sources]
docs-mcp-server = { workspace = true }
# Pinned to an exact revision of pydantic/pydantic-ai#6738 rather than its branch: a
# branch ref moves under CI, so the same commit here could build differently from one
# run to the next. Bump this SHA deliberately when picking up upstream changes.
pydantic-ai = { git = "https://github.com/pydantic/pydantic-ai.git", rev = "fe724b467946e48865510e61a17ff0326137d209" }
pydantic-ai-slim = { git = "https://github.com/pydantic/pydantic-ai.git", subdirectory = "pydantic_ai_slim", rev = "fe724b467946e48865510e61a17ff0326137d209" }
# "__init__.py" = ["F401", "I001", "RUF013"]
# "src/prefect_mcp_server/__init__.py" = ["E402"]
